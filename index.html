<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Duomo View Apartment</title>

<style>

body {

  font-family: Arial, sans-serif;

  max-width: 700px;

  margin: auto;

  padding: 24px;

  background: #f8f5ef;

  color: #333;

  line-height: 1.6;

}

h1, h2 { color: #725638; }

button {

  padding: 14px 20px;

  margin: 6px;

  border: 0;

  border-radius: 8px;

  background: #725638;

  color: white;

  font-size: 17px;

}

.content {

  background: white;

  padding: 20px;

  border-radius: 12px;

  margin-top: 20px;

}

</style>

</head>

<body>

<h1>Duomo View Apartment</h1>

<p>Little tips for a happy and easy stay</p>

<div style="text-align:center">

  <button onclick="showLanguage('en')">🇬🇧 English</button>

  <button onclick="showLanguage('it')">🇮🇹 Italiano</button>

</div>

<div id="guide" class="content"></div>

<script>

const guides = {

en: `

<h2>Welcome!</h2>

<p>Welcome to Duomo View Apartment. We wish you a pleasant and comfortable stay in Monreale.</p>

<h2>Parking</h2>

<p>Free parking is available under the building, subject to availability. If those spaces are occupied, street parking may be available nearby; some spaces are paid. Please check the signs.</p>

<h2>Contact us</h2>

<p>For assistance, contact your hosts:</p>

<p>+447354809099<br>+393285392447</p>

`,

it: `

<h2>Benvenuti!</h2>

<p>Benvenuti al Duomo View Apartment. Vi auguriamo un soggiorno piacevole e confortevole a Monreale.</p>

<h2>Parcheggio</h2>

<p>Sotto l'edificio sono disponibili posti auto gratuiti, in base alla disponibilità. Se sono occupati, potrebbe essere possibile parcheggiare nelle strade vicine; alcuni posti sono a pagamento. Controllate sempre la segnaletica.</p>

<h2>Contattateci</h2>

<p>Per assistenza, potete contattare i vostri host:</p>

<p>+447354809099<br>+393285392447</p>

`

};

function showLanguage(lang) {

  document.getElementById('guide').innerHTML = guides[lang];

  document.documentElement.lang = lang;

}

showLanguage('en');

</script>

</body>

</html>
